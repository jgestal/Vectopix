name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      # Builds the app and serves it with `vite preview` (see playwright.config.ts)
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  e2e-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # This job needs the real Electron binary
      - run: npm ci
      # Electron's sandbox helper must be root-owned and setuid, and Ubuntu
      # 24.04 restricts the user namespaces Chromium's sandbox uses
      - name: Allow Electron's sandbox
        run: |
          sudo chown root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Native menus and windows need a display: a virtual one
      - run: xvfb-run -a npm run test:e2e:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-desktop-traces
          path: test-results
          retention-days: 7
