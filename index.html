<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vectopix: turn raster images (PNG, JPG, WebP, BMP) into clean vector graphics (SVG, DXF, EPS, PDF) with sub-pixel Bézier curve fitting, right in your browser."
    />
    <title>Vectopix</title>
    <script>
      // The theme before the first paint, so a dark setup never flashes light.
      // Same rule as src/domain/theme.ts; ui/theme.ts takes over once loaded.
      (function () {
        var preference = 'system';
        try {
          var saved = JSON.parse(localStorage.getItem('vectopix.preferences') || '{}').theme;
          if (saved === 'light' || saved === 'dark') preference = saved;
        } catch (e) {}
        var dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
